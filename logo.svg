<?xml version="1.0" encoding="UTF-8"?>
<!--
    Downer wordmark (approximation of the official brand mark).
    Dark near-black wordmark with the signature cyan + lime-green flag.
    Replace with the official vector file when available.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" role="img" aria-label="Downer">
    <!-- Wordmark -->
    <text x="0" y="52"
          font-family="Segoe UI, Arial, sans-serif"
          font-weight="700"
          font-size="54"
          fill="#1D1D1B"
          letter-spacing="-1.5">Downer</text>

    <!-- Flag mark (cyan + lime green squares) -->
    <g transform="translate(215, 6)">
        <rect x="0"  y="0"  width="18" height="18" fill="#00BCE7"/>
        <rect x="20" y="0"  width="18" height="18" fill="#A6E048"/>
        <rect x="0"  y="20" width="18" height="18" fill="#A6E048"/>
    </g>
</svg>
